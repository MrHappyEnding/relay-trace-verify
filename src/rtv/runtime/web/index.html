<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RTV · Relay Trace Verify</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e6e8ee;background:#10131b}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #2c3141;padding:24px 5%;display:flex;align-items:center;gap:18px}.brand{font-size:25px;font-weight:800;letter-spacing:.12em}.tag{font-size:12px;color:#a7b1c3}select{background:#1c2332;color:#e6e8ee;border:1px solid #3b465d;border-radius:7px;padding:9px 14px;cursor:pointer}main{max-width:1320px;margin:auto;padding:34px 30px}h1{font-weight:600;font-size:29px;margin:0 0 12px}p{color:#a7b1c3;font-size:14px;line-height:1.7}.bar{display:flex;gap:14px;align-items:center;margin:28px 0}select{max-width:80%;min-width:300px}.lineage{background:#192333;border:1px solid #31415a;border-radius:12px;padding:20px;margin-bottom:24px;overflow-wrap:anywhere}.small{font-size:12px;color:#a7b1c3}.mono{font:12px ui-monospace,monospace;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{border:1px solid #30384b;border-radius:12px;background:#171c28;padding:22px;min-width:0}.head{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px}.head h2{font-size:18px;margin:0}.status{font-size:12px;color:#a7b1c3;padding:4px 8px;border-radius:5px;background:#252d3e}.succeeded{background:#143c35;color:#8ee4c9}.failed,.cancelled{background:#4c2830;color:#ffb1b5}.metric{display:grid;grid-template-columns:1fr auto;gap:9px;font-size:13px;border-top:1px solid #2b3345;margin-top:18px;padding-top:15px}.metric span:nth-child(odd){color:#a7b1c3}details{margin-top:20px;font-size:13px}summary{cursor:pointer;color:#91e5d1}ol{padding-left:20px;line-height:1.8}li{margin:9px 0}code{font-size:11px;overflow-wrap:anywhere}.note{border-left:3px solid #78b9fa;padding-left:14px;margin-top:28px}#error{color:#ffb1b5}footer{padding-top:30px;color:#778299;font-size:12px}@media(max-width:600px){main{padding:25px 18px}header{padding:18px}.tag{display:none}select{min-width:0;width:100%;max-width:100%}.bar{flex-wrap:wrap}}
</style>
<header><div class="brand">RTV</div><div class="tag">RELAY TRACE VERIFY<br>A platform for reliable agent execution and evaluation.</div></header>
<main><h1 id="title"></h1><p id="intro"></p><div class="bar"><select id="experiments" aria-label="Experiment"></select><span id="fresh" class="small"></span></div><p id="error" role="status"></p><section id="lineage" class="lineage" hidden></section><div id="cards" class="grid"></div><p id="note" class="note"></p><footer>RTV · M3 · Local read-only view</footer></main>
<script>
let data=null;const $=id=>document.getElementById(id);const el=(tag,text,cls)=>{let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e};const money=v=>v==null?'Unknown / subscription unpriced':'$'+v.toFixed(5);const tokens=x=>Object.entries(x?.known_usage||{}).filter(([k])=>k==='input_tokens'||k==='output_tokens').map(([k,v])=>k+': '+v.toLocaleString()).join(' · ')||'—';
function render(){let expanded=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.trial));$('title').textContent='One checkpoint. Multiple continuation paths.';$('intro').textContent='Inspect ownership transfer, workspace lineage and isolated verification. Compare incremental usage separately from prefix-inclusive usage.';$('note').textContent='Development-task acceptance does not establish handoff success rates. UNKNOWN is not zero; subscription tokens are not converted into dollars.';$('cards').replaceChildren();if(!data)return;$('lineage').hidden=false;$('lineage').replaceChildren(el('div','Committed common source → independent workspace branches','small'),el('p',data.source_checkpoint,'mono'),el('div','Config digest: '+data.request_hash,'mono'));for(const r of data.trials){let c=el('article','', 'card'),h=el('div','','head');h.append(el('h2',r.label),el('span',r.status,'status '+r.status));c.append(h,el('div',r.adapter+' · '+(r.model||'scripted model'),'small'),el('p',r.trial_id,'mono'));let m=el('div','','metric');for(const [a,b] of [['Verification',r.result?.rewards?.reward??'—'],['Isolated verifier',r.result?.verification?.isolated?'✓':'—'],['Observed API cost',money(r.ledger.known_api_cost_usd)],['End-to-end cost',money(r.ledger.end_to_end.cost_usd)],['Pending / unknown',r.ledger.pending_operations+' / '+r.ledger.unknown_operations],['Cleanup',r.cleanup]])m.append(el('span',a),el('span',String(b)));c.append(m,el('p','Branch usage: '+tokens(r.ledger),'mono'),el('p','Shared prefix: '+tokens(r.ledger.prefix),'mono'));c.append(el('p','Checkpoint: '+(r.checkpoint||'—'),'mono'));let d=el('details'),s=el('summary','Handoff and execution trace'),list=el('ol');for(const h of r.handoffs){let li=el('li',h.policy+' · '+h.state);li.append(el('div',h.source_attempt+' → '+h.target_attempt,'mono'));if(h.prepared)li.append(el('div',h.prepared.bytes+' bytes · '+h.prepared.sha256,'mono'));list.append(li)}for(const e of r.events){let li=el('li',e.kind);li.append(el('div',e.at+' · epoch '+e.payload.epoch,'small'));list.append(li)}d.dataset.trial=r.trial_id;d.open=expanded.has(r.trial_id);d.append(s,list);c.append(d);$('cards').append(c)}}
async function refresh(){try{let opts=await fetch('/api/experiments').then(r=>r.json()),selected=$('experiments').value;$('experiments').replaceChildren(...opts.map(e=>{let o=el('option',e.created_at+' · '+e.experiment_id.slice(0,8));o.value=e.experiment_id;return o}));if(opts.some(e=>e.experiment_id===selected))$('experiments').value=selected;if($('experiments').value)data=await fetch('/api/experiment/'+$('experiments').value).then(r=>{if(!r.ok)throw Error('Report unavailable');return r.json()});$('error').textContent=opts.length?'':'No experiments yet. Create paired branches with rtv runtime fork.';$('fresh').textContent='Updated '+new Date().toLocaleTimeString();render()}catch(e){$('error').textContent='Status unavailable; retaining the previous view.'}}$('experiments').onchange=refresh;render();refresh();setInterval(refresh,3000);
</script></html>
