apiVersion: v1
kind: Namespace
metadata:
  name: rtv-m4
  labels:
    rtv.dev/managed-by: rtv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metadata
  namespace: rtv-m4
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rtv-postgres
  namespace: rtv-m4
spec:
  serviceName: rtv-postgres
  replicas: 1
  selector:
    matchLabels: {app: rtv-postgres}
  template:
    metadata:
      labels: {app: rtv-postgres}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3d-rtv-m4-server-0
      containers:
        - name: postgres
          image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          imagePullPolicy: Never
          env:
            - {name: POSTGRES_USER, value: rtv}
            - {name: POSTGRES_PASSWORD, value: rtv-local-cluster}
            - {name: POSTGRES_DB, value: rtv}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, rtv, -d, rtv]
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - {name: metadata, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: metadata
          persistentVolumeClaim: {claimName: metadata}
---
apiVersion: v1
kind: Service
metadata:
  name: rtv-postgres
  namespace: rtv-m4
spec:
  selector: {app: rtv-postgres}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rtv-bound
  namespace: rtv-m4
spec:
  hard:
    pods: '3'
    requests.cpu: 2500m
    requests.memory: 6144Mi
    limits.cpu: 2500m
    limits.memory: 6144Mi
