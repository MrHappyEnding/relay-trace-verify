name: rtv-m1-services
services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_USER: rtv
      POSTGRES_PASSWORD: rtv-local
      POSTGRES_DB: rtv
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtv -d rtv"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  metadata:
